[project]
name = "ho-ml"
version = "0.1.0"
description = "Learning-to-rank and contextual bandits for ho — ranking, calibration, and policy optimization"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.0",
    "google-cloud-pubsub>=2.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# ML ingest daemon: defensive error handling is intentional (must never crash
# mid-poll). Blind Exception catches are graceful-degradation on purpose.
"src/outcomes/outcome_resolver.py" = ["BLE001", "S110"]
"src/outcomes/events.py" = ["BLE001", "S110"]
"src/ranking/features.py" = ["BLE001", "S110"]
"src/ranking/ltr.py" = ["BLE001"]
"src/config.py" = ["BLE001"]
"src/ranking/dataset.py" = ["BLE001", "S110"]
"src/outcomes/gmail_push.py" = ["BLE001", "S110"]
"scripts/gmail_watch_setup.py" = ["BLE001"]
"scripts/train_model.py" = ["BLE001"]
"scripts/eval.py" = ["BLE001"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

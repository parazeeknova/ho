name: ho

services:
  searxng:
    image: searxng/searxng:latest
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      - SEARXNG_SECRET=${SEARXNG_SECRET:-changeme}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  # Self-hosted SOCKS5 proxy rotating IPs via the Tor network, so SearXNG
  # can bypass CAPTCHA blocks from datacenter IPs.
  torproxy:
    image: dperson/torproxy
    restart: "no"
    network_mode: "host"
    environment:
      # Exit only from the persona's country (IN) so the application's geo-IP
      # matches the stated location instead of a random exit that trips the
      # ATS location-mismatch fraud signal.
      LOCATION: "${TOR_EXIT_COUNTRY:-IN}"
    volumes:
      # Fresh Tor geoip databases (mounted read-only) replace the image's
      # stale 2020 geoip, whose country data misclassifies real-world exits
      # (e.g. a Turkish exit labelled IN). Refresh with:
      #   scripts/refresh-tor-geoip.sh
      - ./.tor-geoip/geoip:/usr/share/tor/geoip:ro
      - ./.tor-geoip/geoip6:/usr/share/tor/geoip6:ro

  agent-memory-db:
    image: pgvector/pgvector:pg18
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_memory
    volumes:
      - agent_memory_data:/var/lib/postgresql
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  # Shared LLM-budget store: the radar master + workers + autofill all call
  # the provider (100 RPM / 200K TPM). Redis makes the budget atomically SHARED
  # across those processes so their combined rate stays under the cap — without
  # it each process has its own limit and the total can trip 429s (which
  # stalled fills with long cooldowns). Graceful-degraded: the governor falls
  # back to local-only limiting if this is down.
  redis:
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  neo4j:
    image: neo4j:community-ubi10
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

volumes:
  agent_memory_data:
  neo4j_data:
  neo4j_logs:

name: ho

services:
  searxng:
    image: searxng/searxng:latest
    restart: "no"
    ports:
      - "8080:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
      - SEARXNG_SECRET=${SEARXNG_SECRET:-changeme}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/etc/searxng
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  torproxy:
    image: dperson/torproxy
    restart: "no"
    network_mode: "host"
    environment:
      LOCATION: "${TOR_EXIT_COUNTRY:-IN}"
    volumes:
      - ./.tor-geoip/geoip:/usr/share/tor/geoip:ro
      - ./.tor-geoip/geoip6:/usr/share/tor/geoip6:ro

  agent-memory-db:
    image: pgvector/pgvector:pg18
    restart: "no"
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_memory
    volumes:
      - agent_memory_data:/var/lib/postgresql
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init.sql
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  redis:
    image: redis:alpine
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  neo4j:
    image: neo4j:community-ubi10
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

  steel:
    image: ghcr.io/steel-dev/steel-browser:latest
    restart: "no"
    ports:
      - "3000:3000"
      - "9223:9223"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - CDP_REDIRECT_PORT=9223
      - CHROME_HEADLESS=${STEEL_BROWSER_HEADLESS:-true}
      - CHROME_EXECUTABLE_PATH=${STEEL_CHROME_PATH:-/usr/bin/chromium}
      - LOG_LEVEL=${STEEL_LOG_LEVEL:-info}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

volumes:
  agent_memory_data:
  neo4j_data:
  neo4j_logs:
  searxng_data:
  redis_data:

[project]
name = "ho"
version = "0.1.0"
description = "Thy Job shall be mine"
requires-python = ">=3.14"
dependencies = [
    "firecrawl-py>=4.33.1",
    "markitdown>=0.1.6",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "redis>=8.0.1",
    "rq>=2.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["ho"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

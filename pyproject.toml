[project]
name = "ho"
version = "0.1.0"
description = "Thy Job shall be mine"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "beautifulsoup4>=4.13.0",
    "firecrawl-py>=4.33.1",
    "fpdf2>=2.8.7",
    "generalcompute>=0.2.1",
    "httpx>=0.28.0",
    "markitdown[pdf]>=0.1.6",
    "neo4j>=5.28.0",
    "numpy>=2.0.0",
    "pgvector>=0.4.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.0.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "questionary>=2.1.1",
    "redis>=5.0",
    "rich>=15.0.0",
    "stagehand-py>=0.3.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["ho"]

[tool.ruff.lint.per-file-ignores]
"src/graph/graph_store.py" = ["E501"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.0",
]

[tool.mypy]
python_version = "3.14"
mypy_path = ["packages/ingest", "packages/autofill"]
files = ["packages/ingest/src", "packages/ingest/scripts", "packages/autofill"]
exclude = ["test_.*\\.py$", "conftest\\.py$", "/tests/"]

# Optional cloud deps (azure-storage-blob not installed locally) and
# untyped third-party SDKs (asyncpg, generalcompute, firecrawl).
[[tool.mypy.overrides]]
module = ["azure.*", "asyncpg", "generalcompute", "firecrawl"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "packages/ingest", "packages/autofill"]
# Per-package tests/ dirs hold same-basename files (test_queue.py,
# test_overnight.py appear in multiple packages); importlib mode loads each
# module by file path so they never collide.
addopts = "--import-mode=importlib"
markers = [
    "asyncio: mark a test as an async test",
]

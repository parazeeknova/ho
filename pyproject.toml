[project]
name = "ho"
version = "0.1.12"
description = "Thy Job shall be mine"
requires-python = ">=3.14"
dependencies = [
  "asyncpg>=0.30.0",
  "beautifulsoup4>=4.13.0",
  "certifi>=2024.0.0",
  "discord-py>=2.7.0",
  "fpdf2>=2.8.7",
  "generalcompute>=0.2.1",
  "httpx[socks]>=0.28.0",
  "markitdown[pdf]>=0.1.6",
  "neo4j>=5.28.0",
  "numpy>=2.0.0",
  "pgvector>=0.4.0",
  "playwright>=1.50.0",
  "pydantic>=2.0.0",
  "pymupdf>=1.28.0",
  "pypdf>=6.14.2",
  "python-dotenv>=1.2.2",
  "questionary>=2.1.1",
  "redis>=5.0",
  "rich>=15.0.0",
  # learning system (packages/ml)
  "lightgbm>=4.5.0",
  "scikit-learn>=1.6.0",
  "pandas>=2.2.0",
  "pyarrow>=17.0.0",
  "joblib>=1.4.0",
  "google-api-python-client>=2.140.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.0",
  "google-cloud-pubsub>=2.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # pyflakes
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "SIM", # flake8-simplify
  "C4", # flake8-comprehensions
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["ho"]

[tool.ruff.lint.per-file-ignores]
"src/graph/graph_store.py" = ["E501"]
"packages/ingest/src/memory/pgvector_store.py" = ["E501"]
# ML ingest daemon: defensive error handling is intentional (must never crash
# mid-poll). Blind Exception catches are graceful-degradation on purpose.
"packages/ml/src/outcomes/gmail_push.py" = ["BLE001", "S110"]
"packages/ml/src/outcomes/outcome_resolver.py" = ["BLE001", "S110"]
"packages/ml/src/outcomes/events.py" = ["BLE001", "S110"]
"packages/ml/src/ranking/features.py" = ["BLE001", "S110"]
"packages/ml/src/ranking/ltr.py" = ["BLE001"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-mock>=3.15.1",
  "pytest-xdist>=3.8.0,<4.0.0",
  "ruff>=0.16.0",
  "ty>=0.0.84",
]

[tool.ty.environment]
python-version = "3.14"
extra-paths = [
  "packages/ingest",
  "packages",
  "packages/autofill/scripts",
  "packages/ingest/scripts",
]

[tool.ty.src]
exclude = ["**/test_*.py", "**/conftest.py", "**/tests/**", "**/__pycache__/**"]

[tool.ty.rules]
# Packages import each other via plain `src.` modules resolved from extra-paths.
unresolved-import = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", "packages/ingest", "packages"]
# Tests live alongside their source files. Same-basename test modules
# (test_queue.py, test_overnight.py) exist in more than one package, so
# importlib mode loads each by file path and they never collide.
addopts = "--import-mode=importlib"
markers = ["asyncio: mark a test as an async test"]

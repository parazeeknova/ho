use_default_settings: true

server:
  secret_key: "changeme"
  image_proxy: true

search:
  formats:
    - html
    - json

botdetection:
  enabled: false

outgoing:
  request_timeout: 15.0
  max_request_timeout: 30.0
  # Route search-engine requests through the self-hosted Tor SOCKS5
  # proxy (docker-compose torproxy service) so egress IP rotates and
  # upstream CAPTCHA blocks are bypassed.
  proxies:
    tor://:
      - socks5://127.0.0.1:9050

engines:
  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false

  - name: github
    engine: github
    shortcut: gh
    disabled: false

  - name: wikidata
    disabled: true
